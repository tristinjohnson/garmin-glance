# Dashboard configuration. Race names + dates are not sensitive, so this file
# is committed. Copy to config.local.toml (gitignored) to override locally.

[windows]
load_weeks = 12          # CTL / ATL / TSB + VO2 max trend
recovery_weeks = 6       # HRV / resting HR / sleep
mileage_weeks = 12       # weekly run/bike/swim volume + time
table_days = 28          # recent-activities table
refetch_recent_days = 3  # always re-pull the last N days (data still settling)

