name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest

      - name: Demo build smoke test
        run: uv run dashboard.py --demo --out /tmp/demo.html && test -s /tmp/demo.html

      - name: Single-file prototype still compiles
        run: uv run python -m py_compile simple-garmin-dashboard/dashboard.py
